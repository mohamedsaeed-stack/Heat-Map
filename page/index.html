/* MarkerCluster.css - inlined because the artifact viewer blocks external stylesheets */
.leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow {
	-webkit-transition: -webkit-transform 0.3s ease-out, opacity 0.3s ease-in;
	-moz-transition: -moz-transform 0.3s ease-out, opacity 0.3s ease-in;
	-o-transition: -o-transform 0.3s ease-out, opacity 0.3s ease-in;
	transition: transform 0.3s ease-out, opacity 0.3s ease-in;
}

.leaflet-cluster-spider-leg {
	/* stroke-dashoffset (duration and function) should match with leaflet-marker-icon transform in order to track it exactly */
	-webkit-transition: -webkit-stroke-dashoffset 0.3s ease-out, -webkit-stroke-opacity 0.3s ease-in;
	-moz-transition: -moz-stroke-dashoffset 0.3s ease-out, -moz-stroke-opacity 0.3s ease-in;
	-o-transition: -o-stroke-dashoffset 0.3s ease-out, -o-stroke-opacity 0.3s ease-in;
	transition: stroke-dashoffset 0.3s ease-out, stroke-opacity 0.3s ease-in;
}

<style>
  :root {
    --ground:   #eef1f6;
    --sidebar:  #0f1c33;
    --card:     #ffffff;
    --line:     #dde3ec;
    --line-dk:  #2a3b5c;
    --ink:      #0f1c33;
    --ink-dk:   #e8edf6;
    --muted:    #5b6b85;
    --muted-dk: #93a3bd;
    --accent:   #2970ff;

    --l-universe:   #00bbb9;
    --l-crm:        #8494ad;
    --l-process:    #2970ff;
    --l-lost-sales: #d64545;
    --l-lost-risk:  #e08600;
    --l-won:        #12805c;

    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0a1220; --card: #141f33; --line: #25324a;
      --ink: #e8edf6; --muted: #93a3bd; --accent: #5b9dff;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0a1220; --card: #141f33; --line: #25324a;
    --ink: #e8edf6; --muted: #93a3bd; --accent: #5b9dff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100%; align-items: stretch; }

  .side {
    width: 330px; flex: 0 0 330px; background: var(--sidebar); color: var(--ink-dk);
    display: flex; flex-direction: column; overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .side-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line-dk); }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .tagline { font-size: 11.5px; color: var(--muted-dk); margin-top: 3px; }
  .stamp { font-family: var(--mono); font-size: 10.5px; color: var(--muted-dk); margin-top: 9px; line-height: 1.7; }
  .stamp b { color: var(--ink-dk); font-weight: 500; }

  .block { padding: 16px 20px; border-bottom: 1px solid var(--line-dk); }
  .block-t {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted-dk); margin-bottom: 11px; display: flex; align-items: center; gap: 7px;
  }

  .layer { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  .layer input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { width: 30px; height: 17px; border-radius: 99px; background: #31415f; position: relative; flex: 0 0 30px; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .layer input:checked + .sw { background: var(--dot, var(--accent)); }
  .layer input:checked + .sw::after { transform: translateX(13px); }
  .layer input:disabled + .sw { opacity: .4; }
  .layer.off { cursor: not-allowed; }
  .lname { font-size: 12.5px; display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); flex: 0 0 9px; }
  .lcount { font-family: var(--mono); font-size: 11px; color: var(--muted-dk); white-space: nowrap; }
  .layer input:disabled ~ .lname { color: var(--muted-dk); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 11.5px; padding: 5px 10px; border-radius: 99px; cursor: pointer;
    background: transparent; color: var(--muted-dk); border: 1px solid var(--line-dk);
    display: flex; align-items: center; gap: 6px; transition: .12s;
  }
  .chip:hover { border-color: #40557e; color: var(--ink-dk); }
  .chip[aria-pressed="true"] { color: #fff; border-color: transparent; background: var(--cc, var(--accent)); }
  .chip .n { font-family: var(--mono); opacity: .8; font-size: 10.5px; }
  .chip-acts { display: flex; gap: 12px; margin-top: 10px; }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .tbl th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-dk); padding: 0 0 6px; border-bottom: 1px solid var(--line-dk); }
  .tbl th:last-child, .tbl td:last-child { text-align: right; }
  .tbl td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .tbl tr { cursor: pointer; }
  .tbl tr:hover td { color: var(--accent); }
  .tbl td.mono { font-family: var(--mono); color: var(--muted-dk); }
  .tbl-wrap { max-height: 250px; overflow-y: auto; }

  .main { flex: 1; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; background: var(--ground); }
  .leaflet-container { background: var(--ground); font-family: var(--sans); }

  .stats { position: absolute; top: 14px; left: 14px; z-index: 600; display: flex; flex-direction: column; gap: 8px; max-width: 200px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; box-shadow: 0 1px 3px rgba(15,28,51,.10); }
  .stat .n { font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .stat .l { font-size: 10.5px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 5px; }

  .basemap-pick { position: absolute; top: 14px; right: 14px; z-index: 600; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: flex; gap: 2px; box-shadow: 0 1px 3px rgba(15,28,51,.10); }
  .bm { font: inherit; font-size: 11px; padding: 5px 10px; border-radius: 7px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .bm[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .bm:disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }

  .notice { position: absolute; left: 14px; bottom: 22px; z-index: 600; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--l-lost-risk); border-radius: 10px; padding: 10px 13px; box-shadow: 0 1px 3px rgba(15,28,51,.10); font-size: 11.5px; color: var(--muted); }
  .notice b { color: var(--ink); font-weight: 600; }
  .notice.ok { border-left-color: var(--l-won); }

  .i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid currentColor; background: none; color: var(--muted); font-size: 9px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0; flex: 0 0 14px; font-family: var(--sans); }
  .i:hover { color: var(--accent); }
  .side .i { color: var(--muted-dk); }
  dialog.info { border: 1px solid var(--line); border-radius: 12px; padding: 0; max-width: 470px; width: calc(100% - 32px); background: var(--card); color: var(--ink); box-shadow: 0 12px 40px rgba(15,28,51,.22); }
  dialog.info::backdrop { background: rgba(15,28,51,.45); }
  .info-h { padding: 14px 18px 0; font-size: 14px; font-weight: 650; }
  .info-b { padding: 10px 18px 16px; font-size: 12.5px; color: var(--muted); }
  .info-b dt { font-weight: 600; color: var(--ink); margin-top: 11px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .info-b dd { margin: 3px 0 0; }
  .info-b code { font-family: var(--mono); font-size: 11px; }
  .info-f { padding: 0 18px 14px; text-align: right; }
  .btn { font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #fff; border: 0; cursor: pointer; }

  .pop-name { font-size: 13px; font-weight: 650; color: var(--ink); }
  .pop-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pop-src { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content { margin: 11px 13px; }

  /* clusters, themed rather than the library default green/yellow */
  .marker-cluster { background: transparent; }
  .marker-cluster div {
    width: 34px; height: 34px; margin-left: 1px; margin-top: 1px;
    border-radius: 50%; color: #fff; text-align: center; font-family: var(--mono);
    font-size: 11px; font-weight: 600; line-height: 34px;
    border: 2px solid rgba(255,255,255,.85); box-shadow: 0 1px 4px rgba(15,28,51,.3);
  }
  .marker-cluster-small div  { background: rgba(41,112,255,.85); }
  .marker-cluster-medium div { width: 40px; height: 40px; line-height: 40px; background: rgba(0,187,185,.88); }
  .marker-cluster-large div  { width: 46px; height: 46px; line-height: 46px; background: rgba(15,28,51,.88); font-size: 12px; }

  .legend { position: absolute; right: 14px; bottom: 96px; z-index: 600; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; box-shadow: 0 1px 3px rgba(15,28,51,.10); font-size: 11px; }
  .legend-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: var(--muted); }
  .legend-row i { width: 9px; height: 9px; border-radius: 50%; display: block; flex: 0 0 9px; }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .side { width: 100%; flex: 0 0 auto; max-height: 46%; }
    .main { flex: 1 1 auto; min-height: 340px; }
    .stats { max-width: 150px; }
    .notice { max-width: calc(100% - 28px); }
    .legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">

<dialog class="info" id="dlg">
  <div class="info-h" id="dlg-h"></div>
  <div class="info-b" id="dlg-b"></div>
  <div class="info-f"><button class="btn" id="dlg-x">Close</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return n == null ? '--' : n.toLocaleString('en-US'); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };

  // Category colours. Assigned in a fixed order and never recycled, so a
  // category keeps its colour no matter which others are switched on.
  //
  // Validated 19 Sep 2026 against light and dark surfaces: lightness band,
  // chroma floor, colour-vision separation and normal-vision separation all
  // pass in both. The first set used grey for manufacturing and amber for
  // retail and failed the chroma floor and the contrast check. Grey is not a
  // hue; on a map it reads as "no category".
  var CAT_COLOR = {
    hospitality_fnb:       '#e8590c',
    medical_healthcare:    '#1098ad',
    marketing_advertising: '#c2255c',
    auto_automotive:       '#2f9e44',
    contracting_fitout:    '#6741d9',
    retail:                '#b58900',
    manufacturing_trading: '#ae3ec9'
  };

  // Two providers have been ruled out, both only visible by looking at the page:
  //
  // CARTO Voyager still serves tiles without a key, but stamps "API KEY REQUIRED"
  // across every one. It fires tileload, not tileerror, so no automatic check
  // would have caught it.
  //
  // tile.openstreetmap.org was the Streets layer until 8 Oct 2026, when it started
  // returning 403 "Access blocked - App is not following the tile usage policy"
  // (osm.wiki/Blocked). Those are volunteer-run servers and the policy forbids bulk
  // or app-scale fetching; a map with ~18,000 markers that people pan around is
  // exactly the load it is meant to keep off them. The block lands on the viewer's
  // IP, so it follows the office network rather than the deployment, and switching
  // providers is the fix rather than waiting it out.
  //
  // Esri's public basemaps carry no such restriction and need no key. Light Gray is
  // the default because a muted basemap is the right one under this many pins.
  //
  // OpenStreetMap remains the source of the business DATA (ODbL) and is credited
  // throughout the page - that is unaffected by where the tiles come from.
  var BASEMAPS = [
    { key: 'streets', label: 'Streets',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      maxZoom: 19, attribution: 'Esri, HERE, Garmin &middot; data &copy; OpenStreetMap contributors' },
    { key: 'esri', label: 'Detailed',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      maxZoom: 19, attribution: 'Esri, HERE, Garmin &middot; data &copy; OpenStreetMap contributors' },
    { key: 'satellite', label: 'Satellite',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      maxZoom: 19, attribution: 'Esri, Maxar, Earthstar Geographics &middot; data &copy; OpenStreetMap contributors' }
  ];

  var UAE = L.latLngBounds([22.6, 51.5], [26.2, 56.5]);
  var DUBAI = L.latLngBounds([24.79, 54.90], [25.34, 55.60]);

  var map = L.map('map', {
    zoomControl: false, attributionControl: true, maxBounds: UAE.pad(0.4), minZoom: 7
  }).setView([25.12, 55.25], 10);

  // Bottom right, clear of the stat cards top-left and the basemap switcher
  // top-right. The default top-left position sat on top of the first stat card.
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Re-fit once the container has its real size; a fitBounds before layout
  // settles lands on the whole country instead of the city.
  setTimeout(function () { map.invalidateSize(); map.fitBounds(DUBAI, { padding: [20, 20] }); }, 250);

  var tileState = {}, current = null, layerObj = {};

  function makeTiles(b) {
    var opts = { maxZoom: b.maxZoom, attribution: b.attribution };
    if (b.subdomains) opts.subdomains = b.subdomains;
    var t = L.tileLayer(b.url, opts), ok = 0, bad = 0;
    t.on('tileload', function () { ok++; if (tileState[b.key] !== 'ok') { tileState[b.key] = 'ok'; paintBasemaps(); } });
    t.on('tileerror', function () {
      bad++;
      if (ok === 0 && bad >= 5 && tileState[b.key] !== 'blocked') {
        tileState[b.key] = 'blocked'; paintBasemaps();
        if (current === b.key) nextBasemap();
      }
    });
    return t;
  }
  function useBasemap(key) {
    if (current === key) return;
    if (current && layerObj[current]) map.removeLayer(layerObj[current]);
    current = key;
    var b = BASEMAPS.filter(function (x) { return x.key === key; })[0];
    if (!layerObj[key]) layerObj[key] = makeTiles(b);
    layerObj[key].addTo(map);
    if (layerObj[key].bringToBack) layerObj[key].bringToBack();
    paintBasemaps();
  }
  function nextBasemap() {
    for (var i = 0; i < BASEMAPS.length; i++) {
      if (tileState[BASEMAPS[i].key] !== 'blocked') { useBasemap(BASEMAPS[i].key); return; }
    }
  }
  function paintBasemaps() {
    var host = $('basemaps'); host.innerHTML = '';
    BASEMAPS.forEach(function (b) {
      var btn = document.createElement('button');
      btn.className = 'bm'; btn.type = 'button'; btn.textContent = b.label;
      btn.setAttribute('aria-pressed', current === b.key ? 'true' : 'false');
      if (tileState[b.key] === 'blocked') { btn.disabled = true; btn.title = 'Blocked by the viewer'; }
      btn.onclick = function () { useBasemap(b.key); };
      host.appendChild(btn);
    });
  }

  var META = null, COMM = null, UNI = null;
  var uniData = {};                 // category key -> {places:[...]}
  var selected = {}, layerOn = { universe: true };
  var commLayer = L.layerGroup();
  var uniCluster = null;

  var LAYERS = [
    { key: 'universe',    label: 'Market universe', color: 'var(--l-universe)' },
    { key: 'crm',         label: 'On the CRM',      color: 'var(--l-crm)' },
    { key: 'in_process',  label: 'In process',      color: 'var(--l-process)' },
    { key: 'closed_lost', label: 'Closed lost',     color: 'var(--l-lost-sales)' },
    { key: 'closed_won',  label: 'Closed won',      color: 'var(--l-won)' }
  ];

  function setNotice(title, body, ok) {
    var n = $('notice');
    n.className = 'notice' + (ok ? ' ok' : '');
    n.innerHTML = '<b>' + esc(title) + '</b><br>' + esc(body);
  }

  function renderStamps() {
    var s = META.snapshot;
    $('stamps').innerHTML =
      'CRM snapshot <b>' + esc(s.crm_pulled) + '</b><br>' +
      'Map data <b>OpenStreetMap, ' + esc(UNI ? UNI._pulled : s.osm_pulled) + '</b><br>' +
      'Admin app <b>' + (s.admin_pulled ? esc(s.admin_pulled) : 'not connected') + '</b>';
  }

  function universeCount() {
    if (!UNI) return 0;
    return Object.keys(UNI.categories).reduce(function (s, k) {
      return s + (selected[k] ? (UNI.categories[k].places || 0) : 0);
    }, 0);
  }

  function renderLayers() {
    var host = $('layers'); host.innerHTML = '';
    LAYERS.forEach(function (l) {
      var info = META.layers[l.key] || { built: false };
      var built = l.key === 'universe' ? !!UNI : !!info.built;
      var lab = document.createElement('label');
      lab.className = 'layer' + (built ? '' : ' off');
      lab.style.setProperty('--dot', l.color);
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'layer-' + l.key; cb.disabled = !built;
      cb.checked = built && layerOn[l.key] !== false;
      cb.onchange = function () { layerOn[l.key] = cb.checked; draw(); };
      var sw = document.createElement('span'); sw.className = 'sw';
      var nm = document.createElement('span'); nm.className = 'lname';
      nm.innerHTML = '<span class="dot"></span>' + esc(l.label);
      var ct = document.createElement('span'); ct.className = 'lcount';
      ct.textContent = built ? (l.key === 'universe' ? fmt(universeCount()) : fmt(info.count)) : 'not pulled yet';
      lab.appendChild(cb); lab.appendChild(sw); lab.appendChild(nm); lab.appendChild(ct);
      host.appendChild(lab);
    });
  }

  function renderChips() {
    var host = $('chips'); host.innerHTML = '';
    META.categories.filter(function (c) { return c.target; }).forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + c.key;
      b.style.setProperty('--cc', CAT_COLOR[c.key] || 'var(--accent)');
      b.setAttribute('aria-pressed', selected[c.key] ? 'true' : 'false');
      var n = UNI && UNI.categories[c.key] ? UNI.categories[c.key].places : c.companies;
      b.innerHTML = esc(c.label) + ' <span class="n">' + fmt(n) + '</span>';
      b.onclick = function () {
        selected[c.key] = !selected[c.key];
        b.setAttribute('aria-pressed', selected[c.key] ? 'true' : 'false');
        draw();                       // categories never touch the layer toggles
      };
      host.appendChild(b);
    });
  }

  function renderLegend() {
    if (!UNI) { $('legend').hidden = true; return; }
    $('legend').hidden = false;
    $('legend').innerHTML = META.categories.filter(function (c) { return c.target && selected[c.key]; })
      .map(function (c) {
        var u = UNI.categories[c.key] || {};
        return '<div class="legend-row"><i style="background:' + (CAT_COLOR[c.key] || '#888') + '"></i>' +
               esc(c.label) + (u.credible === false ? ' <span style="opacity:.6">(thin)</span>' : '') + '</div>';
      }).join('') || '<div class="legend-row">No categories selected</div>';
  }

  function renderStats() {
    var picked = META.categories.filter(function (c) { return c.target && selected[c.key]; });
    var crm = picked.reduce(function (s, c) { return s + c.companies; }, 0);
    var cust = picked.reduce(function (s, c) { return s + c.customers; }, 0);
    var rows = [
      { n: fmt(universeCount()), l: 'Businesses on the map', info: 'universe', color: 'var(--l-universe)' },
      { n: fmt(crm),  l: 'On the CRM', info: 'crm', color: 'var(--l-crm)' },
      { n: fmt(cust), l: 'Customers',  info: 'won', color: 'var(--l-won)' }
    ];
    $('stats').innerHTML = rows.map(function (r) {
      return '<div class="stat"><div class="n" style="color:' + r.color + '">' + r.n + '</div>' +
             '<div class="l"><span>' + esc(r.l) + '</span>' +
             '<button class="i" data-info="' + r.info + '" aria-label="How this is derived">i</button></div></div>';
    }).join('');
    wireInfo();
  }

  function renderAreas() {
    var names = Object.keys(COMM.communities).sort();
    $('areas').innerHTML = names.map(function (n) {
      var c = COMM.communities[n];
      return '<tr data-c="' + esc(n) + '"><td>' + esc(n) + '</td><td class="mono">' + esc(c.sector) +
             '</td><td class="mono" data-n="' + esc(n) + '">--</td></tr>';
    }).join('');
    Array.prototype.forEach.call($('areas').querySelectorAll('tr'), function (tr) {
      tr.onclick = function () {
        var c = COMM.communities[tr.getAttribute('data-c')];
        if (c) map.flyTo([c.lat, c.lng], 14, { duration: .6 });
      };
    });
  }

  // Count universe places per community by nearest centroid, so the area table
  // ranks by something real rather than sitting empty.
  function fillAreaCounts() {
    var names = Object.keys(COMM.communities);
    var pts = names.map(function (n) { return { n: n, lat: COMM.communities[n].lat, lng: COMM.communities[n].lng }; });
    var tally = {};
    Object.keys(uniData).forEach(function (k) {
      if (!selected[k]) return;
      uniData[k].places.forEach(function (p) {
        var best = null, bd = Infinity;
        for (var i = 0; i < pts.length; i++) {
          var dy = pts[i].lat - p.y, dx = (pts[i].lng - p.x) * 0.9;
          var d = dy * dy + dx * dx;
          if (d < bd) { bd = d; best = pts[i].n; }
        }
        // ~4.5km cutoff; beyond that the nearest centroid is not a real answer
        if (best && bd < 0.0016) tally[best] = (tally[best] || 0) + 1;
      });
    });
    var rows = Array.prototype.slice.call($('areas').querySelectorAll('td[data-n]'));
    rows.forEach(function (td) { td.textContent = fmt(tally[td.getAttribute('data-n')] || 0); });
    // re-sort the table by count, descending
    var tbody = $('areas');
    var trs = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    trs.sort(function (a, b) {
      return (tally[b.getAttribute('data-c')] || 0) - (tally[a.getAttribute('data-c')] || 0);
    });
    trs.forEach(function (tr) { tbody.appendChild(tr); });
  }

  function drawUniverse() {
    if (uniCluster) { map.removeLayer(uniCluster); uniCluster = null; }
    if (!UNI || layerOn.universe === false) return;

    uniCluster = L.markerClusterGroup({
      chunkedLoading: true, maxClusterRadius: 55,
      spiderfyOnMaxZoom: true, showCoverageOnHover: false,
      disableClusteringAtZoom: 17
    });

    Object.keys(uniData).forEach(function (k) {
      if (!selected[k]) return;
      var color = CAT_COLOR[k] || '#888';
      var label = (META.categories.filter(function (c) { return c.key === k; })[0] || {}).label || k;
      uniData[k].places.forEach(function (p) {
        L.circleMarker([p.y, p.x], {
          radius: 5, color: '#ffffff', weight: 1.5, opacity: .9,
          fillColor: color, fillOpacity: .85
        }).bindPopup(
          '<div class="pop-name">' + esc(p.n) + '</div>' +
          '<div class="pop-meta">' + esc(label) + ' &middot; ' + esc(String(p.k).replace(/_/g, ' ')) + '</div>' +
          '<div class="pop-src">OpenStreetMap ' + esc(p.id) + '</div>'
        ).addTo(uniCluster);
      });
    });
    map.addLayer(uniCluster);
  }

  function draw() {
    renderStats();
    renderLegend();
    renderLayers();
    drawUniverse();
    fillAreaCounts();
  }

  var INFO = {
    layers: { h: 'The five layers', b: function () {
      return '<dl>' + LAYERS.map(function (l) {
        var i = META.layers[l.key] || {};
        var note = (l.key === 'universe' && UNI)
          ? 'Built. ' + fmt(Object.keys(UNI.categories).reduce(function (s, k) { return s + (UNI.categories[k].places || 0); }, 0)) +
            ' named businesses in ' + esc(UNI._emirate) + ' from OpenStreetMap, pulled ' + esc(UNI._pulled) + '.'
          : (i.note || '');
        return '<dt>' + esc(l.label) + '</dt><dd>' + note + '</dd>';
      }).join('') + '</dl>' +
      '<dt>What would make this wrong</dt><dd>A layer switched on before its data is pulled would show ' +
      'an empty map that looks like an answer. An unbuilt layer cannot be switched on.</dd>'; } },

    universe: { h: 'Businesses on the map', b: function () {
      if (!UNI) return 'Not pulled yet.';
      var rows = Object.keys(UNI.categories).map(function (k) {
        var c = UNI.categories[k];
        return '<dt>' + esc(c.label) + '</dt><dd>' + fmt(c.places) + ' named places' +
          (c.unnamed_dropped ? ', ' + fmt(c.unnamed_dropped) + ' unnamed features dropped' : '') +
          (c.credible === false ? '. <b>Thin.</b> OpenStreetMap barely maps this category in the UAE, so it is shown but coverage must not be computed from it.' : '') +
          '</dd>';
      }).join('');
      return '<dl><dt>Derivation</dt><dd>Every business OpenStreetMap holds inside the ' +
      esc(UNI._emirate) + ' administrative boundary, pulled through the free Overpass API on ' +
      esc(UNI._pulled) + '. The boundary relation is used rather than a bounding box, because a ' +
      'box around Dubai clips into Sharjah.</dd>' +
      '<dt>Only named places are shown</dt><dd>An unnamed feature is real but cannot be matched to a ' +
      'CRM company, so it is counted and dropped rather than drawn as a business.</dd>' + rows +
      '<dt>What would make this wrong</dt><dd>OpenStreetMap is volunteer-mapped. It is strong on ' +
      'shops, restaurants, clinics and workshops, and weak on offices, so it undercounts every ' +
      'category that trades from an office. It is a floor on the market, never a census.</dd></dl>'; } },

    categories: { h: 'How a company gets a category', b: function () {
      return '<dl><dt>On the CRM side</dt><dd>HubSpot’s <code>industry</code> picklist has 130 values ' +
      'in Dubai. Each maps to one of seven buckets through <code>lookups/industry-map.json</code>, ' +
      'applied after the query returns, never in SQL.</dd>' +
      '<dt>On the map side</dt><dd>OpenStreetMap tags are mapped to the same seven buckets by ' +
      '<code>scripts/pull-osm-universe.js</code>. The two sides are mapped separately, which is why ' +
      'a coverage ratio between them carries both mappings’ errors.</dd>' +
      '<dt>Retail</dt><dd>Split out of general trading on 19 Sep 2026: 7 Dubai customers and 895 ' +
      'companies made it a real segment.</dd>' +
      '<dt>What would make this wrong</dt><dd><b>2,635</b> Dubai companies have no industry at all and ' +
      'sit outside all seven buckets; another <b>5,500</b> fall in Other. Fourteen picklist values are ' +
      'genuinely ambiguous, Apparel and Design among them.</dd></dl>'; } },

    crm: { h: 'On the CRM', b: function () {
      var u = META.universe;
      return '<dl><dt>Derivation</dt><dd>' + esc(u.definition) + '</dd>' +
      '<dt>Reconciliation</dt><dd>' + esc(u.reconciliation) + '</dd>' +
      '<dt>Not on the map yet</dt><dd>These companies are <b>counted, not placed</b>. Putting them on ' +
      'the map needs the row-level HubSpot pull, which no connector in this session could reach. Only ' +
      '<b>' + fmt(u.with_address) + '</b> of them hold a street address; the other <b>' +
      fmt(u.with_city_only) + '</b> hold a city only and will sit on a community centroid or stay ' +
      'unlocated. No coordinate is ever invented.</dd>' +
      '<dt>What would make this wrong</dt><dd>The figure counts companies whose <code>city</code> says ' +
      'Dubai. A company trading in Dubai but registered elsewhere is missing from it.</dd></dl>'; } },

    won: { h: 'Customers', b: function () {
      return '<dl><dt>Derivation</dt><dd>HubSpot companies in Dubai at lifecycle stage Customer, by ' +
      'category.</dd>' +
      '<dt>This is the cross-check, not the truth</dt><dd>HubSpot holds <b>106</b> Dubai customers ' +
      'against roughly <b>8,400</b> clients in the FlapKap admin app. The admin app is primary for ' +
      'anything involving money, and its connector is dead. Read 106 as a floor.</dd>' +
      '<dt>What would make this wrong</dt><dd>The only link between the two systems is a hand-typed ' +
      'field on the Deal object, missing on about 17% of deals.</dd></dl>'; } },

    areas: { h: 'Areas', b: function () {
      var missing = META.communities.without_centroid;
      return '<dl><dt>Derivation</dt><dd><b>' + META.communities.defined + '</b> communities are defined ' +
      'in <code>lookups/dubai-communities.json</code>. The count beside each is the number of universe ' +
      'businesses whose nearest community centroid is that one, within about 4.5 km.</dd>' +
      '<dt>Coordinates</dt><dd>Every centroid comes from OpenStreetMap through Nominatim and carries the ' +
      'OSM id that produced it. Only place, boundary and landuse features are accepted: an earlier run ' +
      'that took the first result gave Hatta a road 90 km from the town and Al Fahidi a shop.</dd>' +
      '<dt>Not located</dt><dd><b>' + missing.length + '</b> communities have no usable centroid, so ' +
      'nothing is ever assigned to them: ' + esc(missing.join(', ')) + '.</dd>' +
      '<dt>What would make this wrong</dt><dd>Nearest-centroid is not the same as inside-the-boundary. ' +
      'A business near the edge of two communities can be counted in the wrong one, and the ranking is ' +
      'indicative rather than exact.</dd></dl>'; } }
  };

  function wireInfo() {
    Array.prototype.forEach.call(document.querySelectorAll('.i'), function (b) {
      b.onclick = function () {
        var i = INFO[b.getAttribute('data-info')];
        if (!i) return;
        $('dlg-h').textContent = i.h;
        $('dlg-b').innerHTML = i.b();
        $('dlg').showModal();
      };
    });
  }
  $('dlg-x').onclick = function () { $('dlg').close(); };

  function j(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(u + ' -> ' + r.status); return r.json(); }); }

  Promise.all([j('data/meta.json'), j('data/communities.json')])
    .then(function (res) {
      META = res[0]; COMM = res[1];
      META.categories.forEach(function (c) { if (c.target) selected[c.key] = true; });
      renderStamps(); renderLayers(); renderChips(); renderAreas(); renderStats(); wireInfo();
      nextBasemap();
      return j('data/universe-dubai.json').catch(function () { return null; });
    })
    .then(function (u) {
      if (!u) {
        setNotice('Universe not built', 'data/universe-dubai.json is missing, so the map has no ' +
          'businesses on it. Run scripts/pull-osm-universe.js.');
        return;
      }
      UNI = u;
      var keys = Object.keys(UNI.categories).filter(function (k) { return UNI.categories[k].file; });
      return Promise.all(keys.map(function (k) {
        return j('data/' + UNI.categories[k].file).then(function (d) { uniData[k] = d; })
          .catch(function () { uniData[k] = { places: [] }; });
      })).then(function () {
        renderStamps();
        renderChips();
        draw();
        var total = universeCount();
        var thin = Object.keys(UNI.categories).filter(function (k) { return UNI.categories[k].credible === false; }).length;
        setNotice(fmt(total) + ' real businesses on the map',
          'Every pin is an OpenStreetMap record inside the ' + UNI._emirate + ' boundary, with its own ' +
          'coordinates and its OSM id in the popup. Click a cluster to open it. The CRM, pipeline and ' +
          'customer layers are counted but not placed: that needs the HubSpot row pull, which no ' +
          'connector in this session could reach. ' + thin + ' categories are thin in OpenStreetMap and ' +
          'are marked so in the legend.', true);
      });
    })
    .catch(function (e) { setNotice('Could not load the data files', String(e && e.message ? e.message : e)); });
})();
</script>
